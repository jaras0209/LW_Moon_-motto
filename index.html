<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ead8" />
  <meta name="description" content="馬力全開中秋活動月下抽箴言：點一下抽取一句話，並下載成專屬中秋小卡。" />
  <title>月下抽箴言｜馬力全開中秋佳節</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header" id="siteHeader">
      <a class="brand" href="#top" aria-label="回到頁首">
        <span class="brand-mark" aria-hidden="true">月</span>
        <span class="brand-copy"><small>愛語中秋佳節</small><strong>馬力全開</strong></span>
      </a>
      <a class="back-link" id="backLink" href="https://midautumn-bbq-night.twt249.chatgpt.site/" target="_top" rel="noopener">回活動首頁</a>
    </header>

    <main id="top" class="experience">
      <section class="draw-experience" aria-labelledby="pageTitle">
        <div class="paper-noise" aria-hidden="true"></div>
        <div class="stars" aria-hidden="true">
          <i class="star star-1">✦</i><i class="star star-2">·</i><i class="star star-3">✧</i>
          <i class="star star-4">·</i><i class="star star-5">✦</i><i class="star star-6">·</i>
          <i class="star star-7">✧</i><i class="star star-8">·</i>
        </div>

        <div class="moon-scene" id="moonScene">
          <div class="moon-glow" aria-hidden="true"></div>
          <button class="moon-button" id="moonButton" type="button" aria-label="抽一張箴言" disabled>
            <span class="moon-face" aria-hidden="true">
              <i class="crater crater-a"></i>
              <i class="crater crater-b"></i>
              <i class="crater crater-c"></i>
            </span>
          </button>

          <div class="moon-rabbit" id="moonRabbit" aria-hidden="true">
            <svg viewBox="0 0 150 170" role="presentation">
              <ellipse cx="78" cy="118" rx="42" ry="31" />
              <circle cx="56" cy="87" r="25" />
              <ellipse cx="42" cy="44" rx="11" ry="35" transform="rotate(-15 42 44)" />
              <ellipse cx="65" cy="42" rx="10" ry="34" transform="rotate(8 65 42)" />
              <circle cx="118" cy="105" r="13" />
              <circle class="rabbit-eye" cx="48" cy="82" r="3.5" />
            </svg>
          </div>
        </div>

        <div class="intro-copy">
          <p class="eyebrow" id="eyebrow">MID-AUTUMN · MOONLIGHT MESSAGE</p>
          <h1 id="pageTitle">月下抽箴言</h1>
          <p class="lead">今晚，抽一句給你的話。</p>

          <button class="primary-cta" id="drawBtn" type="button" disabled>
            <span>抽一張箴言</span>
            <b aria-hidden="true">→</b>
          </button>
          <p class="microcopy">抽完可以下載成專屬小卡</p>

          <div class="status-line" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">正在準備箴言…</span>
          </div>
        </div>

        <section class="result-panel" id="resultPanel" aria-labelledby="resultTitle" hidden>
          <div class="result-heading">
            <p>YOUR MOONLIGHT MESSAGE</p>
            <h2 id="resultTitle">今晚給你的話</h2>
          </div>

          <div class="result-stage">
            <canvas id="proverbCanvas" width="1080" height="1350" aria-label="抽到的箴言小卡預覽"></canvas>
          </div>

          <p class="sr-only" id="resultAnnounce" aria-live="polite"></p>

          <div class="result-actions" id="resultActions">
            <button class="action primary" id="downloadBtn" type="button">下載小卡 PNG</button>
            <div class="secondary-actions">
              <button class="action" id="shareBtn" type="button">分享</button>
              <button class="action" id="copyBtn" type="button">複製文字</button>
              <button class="action quiet" id="drawAgainBtn" type="button">再抽一句 ↻</button>
            </div>
          </div>
        </section>
      </section>

      <details class="about-details">
        <summary>關於月下箴言 <span aria-hidden="true">＋</span></summary>
        <div class="about-content">
          <p>每次都是隨機抽取，之後仍可能再次抽到同一句。小卡會直接在你的瀏覽器產生，不需要上傳個人資料。</p>
          <p class="data-version" id="dataVersion">箴言資料載入中</p>
        </div>
      </details>
    </main>

    <footer class="site-footer">
      <span>馬力全開 · 中秋佳節</span>
      <a id="bottomBackLink" href="https://midautumn-bbq-night.twt249.chatgpt.site/" target="_top" rel="noopener">回活動行前通知 →</a>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
